[project]
name = "tabamnesty-analysis"
version = "0.0.1"
description = "Tab Amnesty research bench: clustering, scoring, ablation, refit. Never shipped."
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Research only (laya_probe): the content-judge measurement. Never needed by the extension.
laya = ["laya>=0.3.20"]

[project.scripts]
ta-cluster = "tabamnesty.cli:cluster_main"
ta-score = "tabamnesty.cli:score_main"
ta-ablate = "tabamnesty.cli:ablate_main"
ta-report = "tabamnesty.cli:report_main"
ta-refit = "tabamnesty.refit:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tabamnesty*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
